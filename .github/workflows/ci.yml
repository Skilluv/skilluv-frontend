name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  check:
    name: Type check, build, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
      - name: Install gitleaks
        run: |
          VERSION=8.21.2
          curl -fsSL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks && sudo mv gitleaks /usr/local/bin/
      - name: Secret scan -- source (SE-04)
        run: gitleaks detect --source . --redact --verbose --exit-code 1

      - name: i18n parity + orphan-key check
        run: npm run i18n:check
      - name: XSS {@html} sink audit (FE-06)
        run: bash scripts/check-html-sinks.sh

      - name: Svelte check
        run: npm run check

      - name: Build
        run: npm run build
      - name: Secret scan -- built bundle (SE-04)
        # The client bundle is downloaded by every browser. SvelteKit keeps
        # $env/static/private out of client code; this catches anything of the
        # right shape that slips through.
        run: gitleaks detect --source build --no-git --redact --verbose --exit-code 1
      - name: No source maps in the prod build (SE-04)
        # A .map ships the original source (server logic included) to the
        # browser. Prod builds must not emit them.
        run: |
          maps=$(find build -name '*.map' 2>/dev/null || true)
          if [ -n "$maps" ]; then
            echo "SE-04 FAIL -- source maps in the prod build:"; echo "$maps"; exit 1
          fi
          echo "SE-04 ok -- no source maps in build/"

      - name: Upload Sentry sourcemaps (opt-in)
        if: env.SENTRY_AUTH_TOKEN != ''
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: |
          npx --yes @sentry/cli sourcemaps inject ./build || true
          npx --yes @sentry/cli releases new "${GITHUB_SHA::7}"
          npx --yes @sentry/cli sourcemaps upload --release "${GITHUB_SHA::7}" ./build
          npx --yes @sentry/cli releases finalize "${GITHUB_SHA::7}"

      - name: Unit tests
        run: npm run test:unit -- --run

  e2e:
    name: Playwright end-to-end
    runs-on: ubuntu-latest
    needs: check
    # Playwright currently requires a running backend (proxied /api/* calls).
    # TODO: mock API calls or spin up backend services here. Non-blocking for now.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Playwright tests (unit + axe-core a11y assertions)
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  lighthouse:
    name: Lighthouse mobile perf budget
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run Lighthouse CI
        run: |
          npm install -g @lhci/cli@0.15.x
          lhci autorun --config=./lighthouserc.json || true
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
