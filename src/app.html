<!doctype html>
<html lang="en">
	<head>
		<script>
			(function() {
				if (localStorage.getItem('skilluv-terminal-mode') === 'true') {
					localStorage.removeItem('skilluv-terminal-mode');
				}
				var b = localStorage.getItem('skilluv-theme') || 'forge';
				// Migration ex-noms → nouveaux noms alignés direction warm/scout
				if (b === 'neon') b = 'vesperal';
				if (b === 'terminal') b = 'scriptorium';
				if (['forge','vesperal','arena','scriptorium','sakura','lagune'].indexOf(b) === -1) b = 'forge';
				localStorage.setItem('skilluv-theme', b);
				// Light by default, and this literal is the one that decides: it runs
				// before hydration. `stores/theme.svelte.ts` carries the same default
				// and the two must not drift, or the first paint flips on hydration.
				var m = localStorage.getItem('skilluv-mode') || 'light';
				document.documentElement.setAttribute('data-theme', m === 'dark' ? b : b + '-light');
			})();
		</script>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!-- The site-wide fallback, and the only description a page that sets none
		     will ever have. Both languages, because this file is static: it is
		     emitted before anything knows which locale the visitor lands on. A
		     page that sets its own description overrides this one. -->
		<meta
			name="description"
			content="Skilluv | Prove what you can actually build. Prouve ce que tu sais faire. Pour de vrai."
		/>
		<!-- #FFA701, sampled from the official artwork rather than approximated.
		     The previous value belonged to the placeholder mark. -->
		<meta name="theme-color" content="#FFA701" />
		<meta property="og:site_name" content="Skilluv" />
		<meta property="og:type" content="website" />
		<!-- PNG only, and deliberately. A browser that understands SVG prefers it,
		     so leaving the old placeholder `favicon.svg` here would have kept
		     showing the retired diamond in the tab whatever the PNGs said. The mark
		     exists only as raster today; an SVG from the designer would be strictly
		     better and is the one asset still missing. -->
		<link rel="icon" type="image/png" href="%sveltekit.assets%/favicon.png" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.json" />
		<!-- Opaque, on the ink ground: iOS composites a transparent icon onto
		     white, which haloes a circular mark. -->
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<!-- Preconnect a l'origine API back (evite le cout DNS+TLS sur premier
		     fetch cote client - utile pour /auth/me, /notifications, etc.). -->
		<link rel="preconnect" href="https://api.skill-uv.com" crossorigin />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" data-sveltekit-preload-code="viewport">
		<div id="app">%sveltekit.body%</div>
	</body>
</html>
